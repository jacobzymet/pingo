[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "pingo-tunnel"
version = "0.3.0"
description = "Authenticated ICMP transport with resumable transfers and cross-platform IPv4 VPNs"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
dependencies = ["cryptography>=50.0.2,<51", "noiseprotocol==0.3.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
gui = ["pywebview>=6,<7"]
build = ["pywebview>=6,<7", "pyinstaller>=6,<7", "setuptools>=83"]
research = ["scapy>=2.7,<3"]

[project.scripts]
pingo = "pingo.cli:main"
pingo-measure = "pingo.measure:main"

[project.gui-scripts]
pingo-gui = "pingo.desktop:main"

[tool.setuptools.package-data]
pingo = ["ui/*.html", "ui/*.css", "ui/*.js"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: opt-in privileged networking tests in isolated environments"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
